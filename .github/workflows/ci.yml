name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine3.21
    steps:
      - name: Install build dependencies
        run: apk add --no-cache musl-dev g++ make git file

      - uses: actions/checkout@v4

      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: alpine-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            alpine-${{ hashFiles('**/Cargo.lock') }}-
            alpine-

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Verify static binary
        run: |
          file target/x86_64-unknown-linux-musl/release/otel_dumper
          file target/x86_64-unknown-linux-musl/release/otel_dumper | grep -qE "static"

      - name: Upload binary artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: otel_dumper-x86_64-linux
          path: target/x86_64-unknown-linux-musl/release/otel_dumper

  release:
    name: Update Latest Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: otel_dumper-x86_64-linux
          path: ./artifact

      - name: Prepare binary
        run: |
          chmod +x ./artifact/otel_dumper
          mv ./artifact/otel_dumper ./otel_dumper-x86_64-linux

      - name: Delete old latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automatically built from `master` branch (commit ${{ github.sha }}).

            ## Download

            - `otel_dumper-x86_64-linux`: Static musl binary with SQLite + DuckDB support (runs anywhere)
          draft: false
          prerelease: false
          make_latest: true
          files: otel_dumper-x86_64-linux
