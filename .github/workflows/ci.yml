name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (SQLite-only, musl static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Upload binary artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: otel_dumper-x86_64-linux
          path: target/x86_64-unknown-linux-musl/release/otel_dumper

  check-duckdb:
    name: Check & Test (DuckDB, gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gnu-duckdb-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu --features duckdb

      - name: Run tests
        run: cargo test --target x86_64-unknown-linux-gnu --features duckdb

      - name: Clippy
        run: cargo clippy --target x86_64-unknown-linux-gnu --features duckdb -- -D warnings

      - name: Upload binary artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: otel_dumper-x86_64-linux-duckdb
          path: target/x86_64-unknown-linux-gnu/release/otel_dumper

  release:
    name: Update Latest Release
    needs: [check, check-duckdb]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download musl binary
        uses: actions/download-artifact@v4
        with:
          name: otel_dumper-x86_64-linux
          path: ./artifact-musl

      - name: Download DuckDB binary
        uses: actions/download-artifact@v4
        with:
          name: otel_dumper-x86_64-linux-duckdb
          path: ./artifact-duckdb

      - name: Prepare binaries
        run: |
          chmod +x ./artifact-musl/otel_dumper
          mv ./artifact-musl/otel_dumper ./otel_dumper-x86_64-linux
          chmod +x ./artifact-duckdb/otel_dumper
          mv ./artifact-duckdb/otel_dumper ./otel_dumper-x86_64-linux-duckdb

      - name: Delete old latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automatically built from `master` branch (commit ${{ github.sha }}).

            ## Download

            | Binary | Description |
            |--------|-------------|
            | `otel_dumper-x86_64-linux` | Static musl binary (SQLite only, runs anywhere) |
            | `otel_dumper-x86_64-linux-duckdb` | GNU binary with DuckDB + SQLite support |
          draft: false
          prerelease: false
          make_latest: true
          files: |
            otel_dumper-x86_64-linux
            otel_dumper-x86_64-linux-duckdb
